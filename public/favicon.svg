<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:ital,wght@1,900&amp;display=swap');
      .fav-mbmr {
        font-family: 'Outfit', 'Arial Black', -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 58px;
        fill: #ee2a2a;
        letter-spacing: -3px;
      }
      .fav-auto {
        font-family: 'Outfit', 'Arial', -apple-system, sans-serif;
        font-weight: 900;
        font-style: italic;
        font-size: 28px;
        fill: #e2e8f0;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- 100% Transparent Background - No rect or circle cutout -->

  <!-- MBMR Title -->
  <text x="64" y="66" class="fav-mbmr" text-anchor="middle">MBMR</text>

  <!-- Red Racing Stripe -->
  <rect x="12" y="80" width="46" height="8" rx="2" fill="#ee2a2a" transform="skewX(-14)" />
  <rect x="63" y="80" width="8" height="8" rx="2" fill="#ee2a2a" transform="skewX(-14)" />

  <!-- AUTO Subtitle -->
  <text x="96" y="90" class="fav-auto" text-anchor="middle">AUTO</text>
</svg>